<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Stock Tracker — Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ── Variables ── */
    :root {
      --bg:      #0b0f1a;
      --card:    #111827;
      --border:  #1f2d45;
      --accent:  #3b82f6;
      --accent2: #06b6d4;
      --green:   #10b981;
      --red:     #ef4444;
      --text:    #f1f5f9;
      --muted:   #64748b;
      --input-bg:#0d1526;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Background dots pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: radial-gradient(circle, #1e3a5f 1px, transparent 1px);
      background-size: 30px 30px;
      opacity: 0.3;
      pointer-events: none;
    }

    /* Glow blob */
    body::after {
      content: '';
      position: fixed;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(59,130,246,0.12) 0%, transparent 60%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* ── Login Card ── */
    .login-card {
      position: relative; z-index: 10;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 44px;
      width: 100%;
      max-width: 420px;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .logo-icon {
      font-size: 2.2rem;
      display: block;
      margin-bottom: 10px;
    }

    .logo h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 0.82rem;
      color: var(--muted);
      margin-top: 4px;
    }

    /* Flash message */
    .flash {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      margin-bottom: 20px;
    }
    .flash.error   { background: rgba(239,68,68,0.1);  border: 1px solid rgba(239,68,68,0.3);  color: #f87171; }
    .flash.success { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); color: #34d399; }

    /* Form */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--input-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
    }

    /* Submit button */
    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: white;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
      margin-top: 8px;
      letter-spacing: 0.3px;
    }

    .btn-login:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-login:active { transform: translateY(0); }

    /* Hint */
    .hint {
      text-align: center;
      margin-top: 20px;
      font-size: 0.76rem;
      color: var(--muted);
    }

    .hint span {
      display: inline-block;
      background: rgba(59,130,246,0.1);
      border: 1px solid rgba(59,130,246,0.2);
      border-radius: 6px;
      padding: 2px 8px;
      color: #93c5fd;
      font-size: 0.72rem;
      margin: 2px;
    }

    /* Credits */
    .credits {
      position: fixed;
      bottom: 24px;
      text-align: center;
      z-index: 10;
    }

    .credits p {
      font-size: 0.72rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .credits-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .credit-chip {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.68rem;
      color: var(--muted);
    }

    .credit-chip strong {
      color: var(--text);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="logo">
      <span class="logo-icon">📈</span>
      <h1>Stock Tracker</h1>
      <p>NSUT</p>
    </div>

    <!-- Flash messages -->
    {% for msg, cat in messages %}
    <div class="flash {{ cat }}">{{ msg }}</div>
    {% endfor %}

    <form method="POST" action="/login">
      <div class="form-group">
        <label>USERNAME</label>
        <input type="text" name="username" placeholder="Enter username" required autocomplete="off"/>
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <input type="password" name="password" placeholder="Enter password" required/>
      </div>
      <button class="btn-login" type="submit">Login →</button>
    </form>

    <div class="hint">
      Demo credentials &nbsp;·&nbsp;
      <span>admin</span> / <span>admin123</span>
    </div>
  </div>

  <!-- Credits -->
  <div class="credits">
    <p>Mini Project — Flask & Python</p>
    <div class="credits-list">
      <div class="credit-chip"><strong>Dhruv Kataria</strong> · 2025UIC3548</div>
      <div class="credit-chip"><strong>Shivam Saini</strong> · 2025UIC3551</div>
      <div class="credit-chip"><strong>Akshit Gupta</strong> · 2025UIC3552</div>
      <div class="credit-chip"><strong>Pujeet Shah</strong> · 2025UIC3546</div>
      <div class="credit-chip"><strong>Khushal Wadhwa</strong> · 2025UIC3547</div>
    </div>
  </div>

</body>
</html>
